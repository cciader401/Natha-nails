<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Turnos - Estética Natha</title>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Importación de la fuente Brittany -->
    <link href="https://fonts.googleapis.com/css2?family=Brittany+Signature&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e91e63;
            --dark: #333;
            --light: #f9f9f9;
            --gray: #ddd;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: var(--dark); padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { 
            position: relative;
            width: 100%; 
            max-width: 450px; 
            background: rgba(255, 255, 255, 0.94); 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            overflow: hidden; 
        }

        /* Fondo de marca de agua con diseño de uñas */
        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1604654894610-df63bc536371?q=80&w=600&auto=format&fit=crop');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover; 
            opacity: 0.08; 
            pointer-events: none; 
            z-index: 0;
        }

        .banner-container, .content-padding {
            position: relative;
            z-index: 1;
        }
        
        .banner-container { 
            position: relative; 
            width: 100%; 
            height: 160px; 
            overflow: hidden; 
        }
        .banner-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            filter: brightness(0.7); 
        }
        .banner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: rgba(0, 0, 0, 0.35); 
        }
        .neon-title {
            font-family: 'Brittany Signature', cursive, sans-serif;
            font-size: 3.2rem;
            color: #ff69b4; 
            text-shadow: 
                0 0 5px #ff1493,
                0 0 10px #ff1493,
                0 0 20px #ff69b4,
                0 0 40px #ff69b4;
            margin: 0;
            line-height: 1;
        }
        .neon-subtitle {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 0.85rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 6px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            font-weight: 600;
        }

        .content-padding { padding: 25px; }
        h2 { color: var(--primary); margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        input, select { width: 100%; padding: 10px; border: 1px solid var(--gray); border-radius: 6px; font-size: 0.95rem; background: rgba(255, 255, 255, 0.9); }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        .btn-reservar { background-color: var(--primary); color: white; border: none; width: 100%; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        .btn-reservar:hover { background-color: #d81b60; }
        .mensaje { margin-top: 15px; text-align: center; font-weight: bold; font-size: 0.9rem; }
        .info-horarios { background: #fdf1f5; padding: 10px; border-radius: 6px; font-size: 0.8rem; color: #555; margin-bottom: 15px; border-left: 4px solid var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <div class="banner-container">
        <img src="https://t4.ftcdn.net/jpg/05/65/93/79/360_F_565937969_YRyFHd7tWx7s35LDVCzn6rkKgCBS761n.jpg" alt="Estética Natha Banner">
        <div class="banner-overlay">
            <h1 class="neon-title">Nahta Nails</h1>
            <span class="neon-subtitle">voy Ceci López</span>
        </div>
    </div>

    <div class="content-padding">
        <h2>Reservar Turno ✨</h2>
        
        <div class="info-horarios">
            <strong>Horarios fijos (bloques de 1 hora):</strong><br>
            • Lun a Vie: 09:00 a 19:00 hs<br>
            • Sábados: 09:00 a 12:00 hs (Domingos cerrado)
        </div>

        <form id="formTurno" onsubmit="enviarTurno(event)">
            <div class="form-group">
                <label for="cliente">Tu Nombre y Apellido:</label>
                <input type="text" id="cliente" required placeholder="Ej: María Gómez">
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono / WhatsApp:</label>
                <input type="tel" id="telefono" required placeholder="Ej: 1123456789">
            </div>

            <div class="form-group">
                <label for="servicio">Servicio:</label>
                <select id="servicio" required>
                    <option value="">Seleccioná un servicio...</option>
                    <option value="Manicuría">Manicuría</option>
                    <option value="Pedicuría">Pedicuría</option>
                    <option value="Kapping">Kapping</option>
                    <option value="Esmaltado Semipermanente">Esmaltado Semipermanente</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fechaDia">Fecha del Turno:</label>
                <input type="date" id="fechaDia" required onchange="actualizarHorariosDisponibles()">
            </div>

            <div class="form-group">
                <label for="horaTurno">Hora Exacta:</label>
                <select id="horaTurno" required>
                    <option value="">Primero elegí una fecha...</option>
                </select>
            </div>

            <button type="submit" class="btn-reservar" id="btnSubmit">Confirmar Reserva</button>
            <div class="mensaje" id="mensajeRespuesta"></div>
        </form>
    </div>
</div>

<script>
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbzxTjFZj1DrSA4sZhX6ZshkHJXo-ZFwTgO2Doe6lDMJllPVknrDogAS2Gj29RAaAIRP/exec";

    function actualizarHorariosDisponibles() {
        const fechaInput = document.getElementById('fechaDia').value;
        const selectHora = document.getElementById('horaTurno');
        selectHora.innerHTML = '<option value="">Cargando horarios...</option>';

        if (!fechaInput) {
            selectHora.innerHTML = '<option value="">Primero elegí una fecha...</option>';
            return;
        }

        const partes = fechaInput.split('-');
        const fechaObj = new Date(partes[0], partes[1] - 1, partes[2]);
        const diaSemana = fechaObj.getDay();

        if (diaSemana === 0) {
            selectHora.innerHTML = '<option value="">Domingo cerrado (Elegí otro día)</option>';
            return;
        }

        let htmlOpciones = '<option value="">Seleccioná una hora...</option>';
        let horaInicio = 9;
        let horaFin = (diaSemana === 6) ? 12 : 19;

        for (let h = horaInicio; h < horaFin; h++) {
            let horaFormateada = h < 10 ? `0${h}:00` : `${h}:00`;
            htmlOpciones += `<option value="${horaFormateada}">${horaFormateada}hs</option>`;
        }

        selectHora.innerHTML = htmlOpciones;
    }

    function enviarTurno(event) {
        event.preventDefault();
        
        const btn = document.getElementById('btnSubmit');
        const msg = document.getElementById('mensajeRespuesta');
        
        const fechaDia = document.getElementById('fechaDia').value;
        const horaSeleccionada = document.getElementById('horaTurno').value;

        if (!fechaDia || !horaSeleccionada) {
            msg.style.color = "red";
            msg.innerText = "Por favor completá la fecha y la hora.";
            return;
        }

        const cliente = document.getElementById('cliente').value;
        const telefono = document.getElementById('telefono').value;
        const servicio = document.getElementById('servicio').value;
        const fechaTurnoStr = `${fechaDia}T${horaSeleccionada}:00`;

        btn.disabled = true;
        btn.innerText = "Reservando...";
        msg.style.color = "#333";
        msg.innerText = "Procesando turno...";

        const datos = {
            cliente: cliente,
            telefono: telefono,
            servicio: servicio,
            fechaTurno: fechaTurnoStr
        };

        fetch(URL_SCRIPT, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
        })
        .then(() => {
            btn.disabled = false;
            btn.innerText = "Confirmar Reserva";
            msg.style.color = "green";

            const avisoMiWp = `¡Hola Natha! Tenés un nuevo turno reservado:\n\n👤 Cliente: ${cliente}\n📱 Teléfono: ${telefono}\n💅 Servicio: ${servicio}\n📅 Fecha y Hora: ${fechaTurnoStr}`;
            const linkMiWp = `https://wa.me/5491123705713?text=${encodeURIComponent(avisoMiWp)}`;

            msg.innerHTML = `¡Turno reservado con éxito! 🎉<br><br>
                <a href="${linkMiWp}" target="_blank" style="background:#25d366; color:white; padding:8px 12px; border-radius:5px; text-decoration:none; font-size:0.85rem; display:inline-block; font-weight:bold;">
                    <i class="fa-brands fa-whatsapp"></i> Toca acá para recibir tu aviso en WhatsApp
                </a>`;

            document.getElementById('formTurno').reset();
            document.getElementById('horaTurno').innerHTML = '<option value="">Primero elegí una fecha...</option>';
        })
        .catch(err => {
            console.error(err);
            btn.disabled = false;
            btn.innerText = "Confirmar Reserva";
            msg.style.color = "red";
            msg.innerText = "Hubo un error al conectar con el servidor.";
        });
    }
</script>

</body>
</html>
