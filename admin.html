<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Turnos Natha ✨</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Importación de la fuente Brittany -->
    <link href="https://fonts.googleapis.com/css2?family=Brittany+Signature&display=swap" rel="stylesheet">
    <style>
        .banner-admin-container {
            position: relative;
            width: 100%;
            height: 170px;
            overflow: hidden;
        }
        .banner-admin-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.7);
        }
        .banner-admin-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: rgba(0, 0, 0, 0.35);
        }
        .neon-title {
            font-family: 'Brittany Signature', cursive, sans-serif;
            font-size: 3.2rem;
            color: #ff69b4;
            text-shadow: 
                0 0 5px #ff1493,
                0 0 10px #ff1493,
                0 0 20px #ff69b4,
                0 0 40px #ff69b4;
            margin: 0;
            line-height: 1;
        }
        .neon-subtitle {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 0.85rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 6px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 sm:p-6">

    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-md overflow-hidden">
        <div class="banner-admin-container">
            <img src="https://t4.ftcdn.net/jpg/05/65/93/79/360_F_565937969_YRyFHd7tWx7s35LDVCzn6rkKgCBS761n.jpg" alt="Estética Natha Banner">
            <div class="banner-admin-overlay">
                <h1 class="neon-title">Nahta Nails</h1>
                <span class="neon-subtitle">voy Ceci López</span>
            </div>
        </div>

        <div class="p-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b pb-4 mb-6 gap-4">
                <h1 class="text-xl sm:text-2xl font-bold text-pink-600 flex items-center gap-2">
                    Panel de Administración - Turnos Natha ✨
                </h1>
                <div class="flex gap-2 w-full sm:w-auto">
                    <button onclick="exportarPDF()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center justify-center gap-2 flex-1 sm:flex-none">
                        <i class="fa-solid fa-file-pdf"></i> Descargar en PDF
                    </button>
                    <button onclick="cargarTurnos()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center justify-center gap-2 flex-1 sm:flex-none">
                        <i class="fa-solid fa-sync"></i> Actualizar
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-pink-50 text-pink-700 uppercase text-xs tracking-wider border-b border-pink-100">
                            <th class="py-3 px-4">Cliente</th>
                            <th class="py-3 px-4">Teléfono</th>
                            <th class="py-3 px-4">Servicio</th>
                            <th class="py-3 px-4">Fecha del Turno</th>
                            <th class="py-3 px-4 text-center">Acciones / WhatsApp</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-turnos" class="divide-y divide-gray-100 text-sm text-gray-700">
                        <!-- Dinámico -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbzxTjFZj1DrSA4sZhX6ZshkHJXo-ZFwTgO2Doe6lDMJllPVknrDogAS2Gj29RAaAIRP/exec";

        function formatearFechaEspanol(fechaStr) {
            try {
                const fecha = new Date(fechaStr);
                if (isNaN(fecha.getTime())) return fechaStr;

                const opcionesDía = { 
                    weekday: 'long', 
                    day: 'numeric', 
                    month: 'long', 
                    timeZone: 'America/Argentina/Buenos_Aires' 
                };
                
                let fechaFormateada = fecha.toLocaleDateString('es-ES', opcionesDía);
                const horas = fecha.getHours();
                const minutos = String(fecha.getMinutes()).padStart(2, '0');

                return `${fechaFormateada} a las ${horas}:${minutos}hs`;
            } catch (e) {
                return fechaStr;
            }
        }

        async function cargarTurnos() {
            const tbody = document.getElementById('tabla-turnos');
            tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-gray-500"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Cargando turnos...</td></tr>`;

            try {
                const response = await fetch(URL_SCRIPT);
                const data = await response.json();

                tbody.innerHTML = "";

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-gray-500">No hay turnos registrados en la planilla.</td></tr>`;
                    return;
                }

                data.forEach((turno, index) => {
                    const cliente = turno.cliente || turno.Cliente || "Sin nombre";
                    const telefono = turno.telefono || turno.Teléfono || "-";
                    const servicio = turno.servicio || turno.Servicio || "-";
                    const fechaBruta = turno.fechaTurno || turno.Fecha || turno.fecha || "";

                    const fechaBonita = formatearFechaEspanol(fechaBruta);
                    
                    let telClean = telefono.replace(/\D/g, '');
                    if (telClean.length === 10 && !telClean.startsWith('54')) {
                        telClean = '549' + telClean; 
                    }

                    const mensajeWp = `¡Hola ${cliente}! 👋 Te hablo de *Nahta Nails* para recordarte tu turno agendado para el servicio de *${servicio}* el día *${fechaBonita}*. ¡Te esperamos! ✨`;
                    const linkWp = `https://wa.me/${telClean}?text=${encodeURIComponent(mensajeWp)}`;

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-50 transition-colors";
                    tr.innerHTML = `
                        <td class="py-3 px-4 font-medium text-gray-900">${cliente}</td>
                        <td class="py-3 px-4">${telefono}</td>
                        <td class="py-3 px-4">${servicio}</td>
                        <td class="py-3 px-4 font-semibold text-pink-600">${fechaBonita}</td>
                        <td class="py-3 px-4 text-center flex justify-center gap-2">
                            <a href="${linkWp}" target="_blank" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 shadow-sm transition-all" title="Enviar recordatorio por WhatsApp">
                                <i class="fa-brands fa-whatsapp text-base"></i> Recordar
                            </a>
                            <button onclick="eliminarTurno(${index})" class="text-red-500 hover:text-red-700 p-1.5" title="Eliminar turno">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-red-500">Error al conectar con Google Sheets. Comprobá que la implementación sea pública ("Cualquier usuario").</td></tr>`;
            }
        }

        function exportarPDF() {
            window.print();
        }

        function eliminarTurno(index) {
            if(confirm("¿Estás segura de eliminar este turno?")) {
                alert("Para eliminar desde Google Sheets de forma permanente, recordá borrar la fila correspondiente en tu planilla.");
                cargarTurnos();
            }
        }

        window.onload = cargarTurnos;
    </script>
</body>
</html>
